version: "3.9"

services:
  backup-orchestrator:
    image: ghcr.io/jbkunama1/hai.backupserver-orchestrator:latest
    container_name: backup-orchestrator
    restart: unless-stopped
    networks:
      - highfishNetwork
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
      - ORCHESTRATOR_HOST=${ORCHESTRATOR_HOST:-192.168.178.26}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 3 * * *}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD muss in .env gesetzt sein}
      # Leer = Enrollment deaktiviert (fail-closed)
      - ENROLL_TOKEN=${ENROLL_TOKEN:-}
    volumes:
      # hosts.yml + backupserver.db (SQLite) leben hier und bleiben bei Redeploys erhalten
      - ./app/config:/app/config
      - generated_scripts:/app/generated

  backup-mcp:
    image: ghcr.io/jbkunama1/hai.backupserver-mcp:latest
    container_name: backup-mcp
    restart: unless-stopped
    depends_on:
      - backup-orchestrator
    networks:
      - highfishNetwork
    ports:
      - "8090:8090"
    environment:
      - TZ=Europe/Berlin
      - BACKUP_API_BASE_URL=http://backup-orchestrator:8080
      - BACKUP_API_USER=${BASIC_AUTH_USER:-admin}
      - BACKUP_API_PASSWORD=${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD muss in .env gesetzt sein}

  # Optional: nur mit Profil "telegram" (COMPOSE_PROFILES=telegram bzw. --profile telegram)
  backup-telegram:
    image: ghcr.io/jbkunama1/hai.backupserver-telegram:latest
    container_name: backup-telegram
    profiles: ["telegram"]
    restart: unless-stopped
    depends_on:
      - backup-orchestrator
    networks:
      - highfishNetwork
    environment:
      - TZ=Europe/Berlin
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - DIGEST_TIME=${DIGEST_TIME:-08:00}
      - DIGEST_TZ=${DIGEST_TZ:-Europe/Berlin}
      - BACKUP_API_BASE_URL=http://backup-orchestrator:8080
      - BACKUP_API_USER=${BASIC_AUTH_USER:-admin}
      - BACKUP_API_PASSWORD=${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD muss in .env gesetzt sein}
      - WEB_BASE_URL=http://${ORCHESTRATOR_HOST:-192.168.178.26}:8080
    volumes:
      - telegram_data:/data

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    networks:
      - highfishNetwork
    ports:
      - "4455:80"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Pfad anpassen: Root des SMB-Shares "highfishNAS25" auf 192.168.178.26
      - /mnt/highfishNAS25/Sicherung:/srv:rw
      - filebrowser_config:/config
      - filebrowser_db:/database

volumes:
  generated_scripts:
  telegram_data:
  filebrowser_config:
  filebrowser_db:

# Alle Services haengen am externen Docker-Netzwerk highfishNetwork
# (muss auf dem Host existieren: docker network create highfishNetwork)
networks:
  highfishNetwork:
    external: true
